spring.application.name=territorialerta

spring.profiles.active=local

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (Moldes para Render / Supabase)
# ===================================================================
# URL de conexión a la base de datos de PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/territorialerta}

# Nombre de usuario del administrador de la base de datos
spring.datasource.username=${DB_USER:postgres}

# Contraseña de la base de datos (Sin valor por defecto por seguridad)
spring.datasource.password=${DB_PASSWORD}

# Driver oficial para conectar Java con PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===================================================================
# Controla la creación automática de tablas. 
# 'update' actualiza tus tablas en Supabase automáticamente según tus clases de Java.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la terminal las consultas SQL que Java está haciendo en tiempo real
spring.jpa.show-sql=true

# Da un formato limpio y legible al código SQL que se muestra en la terminal
spring.jpa.properties.hibernate.format_sql=true

# Especifica la sintaxis exacta de PostgreSQL para evitar problemas de compatibilidad
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
